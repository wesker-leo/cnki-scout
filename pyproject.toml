[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnki-scout"
version = "0.1.0"
description = "Low-rate, browser-based CNKI metadata collector for literature screening"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5", "playwright>=1.45,<2"]

[project.scripts]
cnki-scout = "cnki_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
